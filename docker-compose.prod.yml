# Production Docker Compose for Hostinger VPS (or any Linux VPS).
#
# Set environment variables in Hostinger's Docker manager UI, or create a
# .env file on the server before running:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Caddy handles TLS automatically via Let's Encrypt when DOMAIN is set to a
# real domain name. Leave DOMAIN blank (or unset) to serve plain HTTP on :80.

services:
  db:
    image: postgres:17-alpine
    container_name: assetpulse_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-assetpulse}
      POSTGRES_USER: ${POSTGRES_USER:-assetpulse_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_db_password}
    volumes:
      - assetpulse_db_data:/var/lib/postgresql/data
      - ./db/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./db/002_auth.sql:/docker-entrypoint-initdb.d/002_auth.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-assetpulse_user} -d ${POSTGRES_DB:-assetpulse}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g
    networks:
      - assetpulse_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: assetpulse_backend
    restart: on-failure
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-assetpulse_user}:${POSTGRES_PASSWORD:-changeme_db_password}@db:5432/${POSTGRES_DB:-assetpulse}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-secret-key-before-production-use}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@assetpulse.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-AssetPulse2025!}
      APP_ENV: ${APP_ENV:-production}
    depends_on:
      - db
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - assetpulse_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: assetpulse_frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"
    deploy:
      resources:
        limits:
          memory: 128m
    networks:
      - assetpulse_net

  caddy:
    build:
      context: ./caddy
      dockerfile: Dockerfile
    container_name: assetpulse_caddy
    restart: unless-stopped
    environment:
      # Set DOMAIN to your real domain for automatic HTTPS (e.g. myapp.com).
      # Leave as :80 to serve plain HTTP — useful when accessing by IP.
      DOMAIN: ${DOMAIN:-:80}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          memory: 128m
    networks:
      - assetpulse_net

volumes:
  assetpulse_db_data:
    name: assetpulse_db_data
  caddy_data:
    name: assetpulse_caddy_data
  caddy_config:
    name: assetpulse_caddy_config

networks:
  assetpulse_net:
    name: assetpulse_net
    driver: bridge
