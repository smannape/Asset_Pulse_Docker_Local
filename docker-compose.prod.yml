# Production Docker Compose for Hostinger VPS.
#
# Hostinger runs Traefik on ports 80/443 as its platform proxy.
# This compose:
#   - Exposes frontend on port 8080 (direct access: http://IP:8080)
#   - Adds Traefik labels so port 80 routes here too (http://IP or http://domain)
#   - Frontend nginx already proxies /api/* to the backend internally

services:
  db:
    image: postgres:17-alpine
    container_name: assetpulse_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-assetpulse}
      POSTGRES_USER: ${POSTGRES_USER:-assetpulse_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - assetpulse_db_data:/var/lib/postgresql/data
      - ./db/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./db/002_auth.sql:/docker-entrypoint-initdb.d/002_auth.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-assetpulse_user} -d ${POSTGRES_DB:-assetpulse}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g
    networks:
      - assetpulse_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: assetpulse_backend
    restart: on-failure
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-assetpulse_user}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-assetpulse}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-secret-key-before-production-use}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@assetpulse.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-AssetPulse2025!}
      APP_ENV: ${APP_ENV:-production}
    depends_on:
      - db
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - assetpulse_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: assetpulse_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.assetpulse.rule=PathPrefix(`/`)"
      - "traefik.http.routers.assetpulse.entrypoints=web"
      - "traefik.http.services.assetpulse.loadbalancer.server.port=80"
    deploy:
      resources:
        limits:
          memory: 128m
    networks:
      - assetpulse_net

volumes:
  assetpulse_db_data:
    name: assetpulse_db_data

networks:
  assetpulse_net:
    name: assetpulse_net
    driver: bridge
