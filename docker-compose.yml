services:
  db:
    image: postgres:17-alpine
    container_name: assetpulse_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-assetpulse}
      POSTGRES_USER: ${POSTGRES_USER:-assetpulse_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - assetpulse_db_data:/var/lib/postgresql/data
      - ./db/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./db/002_auth.sql:/docker-entrypoint-initdb.d/002_auth.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-assetpulse_user} -d ${POSTGRES_DB:-assetpulse}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - assetpulse_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: assetpulse_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-assetpulse_user}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-assetpulse}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-to-a-random-64-char-secret-before-production}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@assetpulse.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-AssetPulse2025!}
      APP_ENV: ${APP_ENV:-development}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - assetpulse_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: assetpulse_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    networks:
      - assetpulse_net

volumes:
  assetpulse_db_data:
    name: assetpulse_db_data

networks:
  assetpulse_net:
    name: assetpulse_net
    driver: bridge
