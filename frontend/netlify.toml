# Netlify configuration for the Asset Pulse frontend.
# The Python FastAPI backend MUST be hosted separately (Netlify Functions do not run Python natively).
# Set VITE_API_BASE_URL at build time to your deployed API origin (e.g. https://api.example.com).

# Optional: proxy /api/* on the Netlify domain to your separately hosted Python API.
# This lets the frontend keep calling /api/... even in production.
# Replace the destination with your real API URL or remove this block and use VITE_API_BASE_URL.
# Keep this block above the SPA fallback if you uncomment it.
# [[redirects]]
#   from   = "/api/*"
#   to     = "https://your-fastapi-host.example.com/api/:splat"
#   status = 200
#   force  = true

[build]
  base    = "frontend"
  command = "npm install && npm run build"
  publish = "dist"

# SPA fallback so client-side routes work. Keep this after any API proxy rule.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
