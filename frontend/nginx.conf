# Asset Pulse — Nginx config
# Serves the built Vite SPA and reverse-proxies /api to the backend service.

upstream assetpulse_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reasonable defaults for SPA assets
    sendfile on;
    tcp_nopush on;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Reverse-proxy API calls to the FastAPI backend.
    location /api/ {
        proxy_pass http://assetpulse_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Cache hashed Vite assets aggressively.
    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: any unknown path returns index.html so React Router works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
